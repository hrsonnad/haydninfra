<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; connect-src https://ixxnhvqyxkuwyshzdnlc.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; form-action 'none'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Portfolio — haydns.ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/portfolio/portfolio.css?v=v260916.02">
    <script src="../shared/portfolio/boot.js?v=v260916.02"></script>
</head>
<body>
    <div id="pf-gate" class="pf-gate">
        <div class="pf-gate__card">
            <div class="pf-gate__spin"></div>
            <div class="pf-gate__msg" id="pf-gate-msg">Checking access&hellip;</div>
        </div>
    </div>

    <div class="pf-app" id="pf-app" hidden>
        <header class="pf-head">
            <div class="pf-head__top">
                <h1>Portfolio</h1>
                <span class="pf-asof" id="pf-asof"></span>
                <!-- auth.js injects its profile widget into .site-nav__inner when
                     present; without it the widget lands inside the first <nav>
                     and tears the tab strip apart. Keep this element, and keep
                     the tabs a <div> so they can never be the fallback target. -->
                <div class="site-nav__inner" id="pf-authbar">
                    <span class="pf-asof" id="pf-quote-note"></span>
                    <button class="btn outline" id="pf-refresh">Refresh prices</button>
                </div>
            </div>
            <div class="pf-tabs" id="pf-tabs" role="tablist">
                <button class="pf-tab active" data-tab="overview">Overview</button>
                <button class="pf-tab" data-tab="workspace">Rebalance</button>
                <button class="pf-tab" data-tab="plan">Execution</button>
            </div>
        </header>

        <main>
            <section id="view-overview"></section>
            <section id="view-workspace" hidden></section>
            <section id="view-plan" hidden></section>
        </main>
    </div>

    <div id="pf-toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../shared/supabase.js?v=v260916.02"></script>
    <script src="../shared/auth.js?v=v260916.02"></script>
    <script src="../shared/portfolio/charts.js?v=v260916.02"></script>
    <script src="../shared/portfolio/tax.js?v=v260916.02"></script>
    <script src="../shared/portfolio/api.js?v=v260916.02"></script>
    <script src="../shared/portfolio/history.js?v=v260916.02"></script>
    <script src="../shared/portfolio/overview.js?v=v260916.02"></script>
    <script src="../shared/portfolio/workspace.js?v=v260916.02"></script>
    <script src="../shared/portfolio/plan.js?v=v260916.02"></script>
    <script src="../shared/portfolio/app.js?v=v260916.02"></script>
</body>
</html>
